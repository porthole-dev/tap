# Release a pushed version tag with the organization's app release workflow:
# the GitHub release (notes, source archive, SHA512SUMS, provenance
# attestation once public) and a pull request in porthole-dev/pmaports that
# moves temp/tap to the new version. Details and the PMAPORTS_TOKEN secret it
# needs: porthole-dev/.github, .github/workflows/app-release.yml.
#
# A manual run rehearses a release for an existing tag; with dry-run (the
# default) it publishes nothing and pushes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        type: string
        required: true
      dry-run:
        description: Only show what would be released
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
      artifact-metadata: write # record the attested artifact
    uses: porthole-dev/.github/.github/workflows/app-release.yml@06b66d018629f11ebf2e305940855793dbc0b775 # v1.0.0
    with:
      aport: temp/tap
      tag: ${{ inputs.tag || github.ref_name }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      PMAPORTS_TOKEN: ${{ secrets.PMAPORTS_TOKEN }}
