# Weekly, grouped updates; the cooldown leaves a new release a week to be
# pulled if it is compromised. Commits need the maintainer's sign-off before
# merge, like any other (git rebase --signoff).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
