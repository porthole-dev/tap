<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- The NFC Forum N-Mark, the same letterform as the app icon, so the
         launcher, the Permitted Apps row and this app all show one mark.

         The coordinates are baked flat on purpose. The mark is published on a
         1600 unit grid and the obvious way to use it is a pair of nested
         transforms with a negative y scale. Written that way GTK renders
         nothing at all for a symbolic icon: it looks up correctly, reports
         itself symbolic, and draws an empty status page. Every symbolic that
         does work here is a plain path in the icon's own 16x16 space, so this
         is one too, with the transform folded into the numbers.

         Comment inside the root element, and no double hyphen anywhere in it:
         a long comment ahead of the svg tag pushes the format signature out of
         gdk-pixbuf's sniffing window, and a double hyphen is illegal in an XML
         comment. Either one makes the icon vanish from the app grid and the
         portal dialog. -->
